[package]
name = "visualizer-piston"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
piston = "0.53"
piston2d-graphics = "0.40"
pistoncore-glutin_window = "0.69"
piston2d-opengl_graphics = "0.78"
# Same glutin that glutin_window uses, for the runtime fullscreen toggle.
glutin = "0.26"
ringbuf = "0.2"
rosc = "~0.10"
rayon = "1"

# Audio input differs per platform: JACK where it is the norm, CoreAudio (via
# cpal) elsewhere. macOS ships no JACK, so requiring it there would mean a
# third party install just to get sound in.
[target.'cfg(target_os = "linux")'.dependencies]
jack = "0.11.4"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.15"

# Both already in the tree via winit, at these versions. objc is for the
# presentation options and window level, cocoa for setting the window frame in
# points (see src/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.24"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
