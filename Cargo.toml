[package]
name = "visualizer-piston"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
piston = "0.53"
piston2d-graphics = "0.40"
pistoncore-glutin_window = "0.69"
piston2d-opengl_graphics = "0.78"
# Same glutin that glutin_window uses, for the runtime fullscreen toggle.
glutin = "0.26"
jack = "0.11.4"
ringbuf = "0.2"
rosc = "~0.10"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
